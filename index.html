            background: #f1f5f9; 
        }
        .chat-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        .chat-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
        
        /* ORDBLINDE-VENLIGT DESIGN (Dyslexia Mode) */
        body.dyslexic-mode {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif !important;
            letter-spacing: 0.05em !important;
            line-height: 1.8 !important;
        }
        
        /* Simpel animation til "Botten tænker..." */
        .dot-flashing {
            position: relative;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #3b82f6;
            color: #3b82f6;
            animation: dot-flashing 1s infinite linear alternate;
            animation-delay: 0.5s;
        }
        .dot-flashing::before, .dot-flashing::after {
            content: '';
            display: inline-block;
            position: absolute;
            top: 0;
            width: 8px;
            height: 8px;
            border-radius: 5px;
            background-color: #3b82f6;
            color: #3b82f6;
            animation: dot-flashing 1s infinite alternate;
        }
        .dot-flashing::before {
            left: -12px;
            animation-delay: 0s;
        }
        .dot-flashing::after {
            left: 12px;
            animation-delay: 1s;
        }
        @keyframes dot-flashing {
            0% { background-color: #3b82f6; }
            50%, 100% { background-color: #e2e8f0; }
        }
    </style>
</head>

    <script>
        // ==========================================
        // 1. DATA OG KONFIGURATION
        // ==========================================

        const API_ENDPOINT = "https://begrebsforklarer-proxy.awmeister.workers.dev/";
        const MODEL_NAME = "skolegpt-v3";
        const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQk_If0OdItiKC3bbck_knn2VRA-lQ8ZE6F2suSp28eZVTnmxMtNjFEB3T23TDMRIrvdHL02pSH9ThY/pub?output=csv"; 

        // Samtale-startere (Forslag)
        const conversationStarters = {
            "novelleanalyse": [
                "Hjælp mig med personkarakteristik.",
                "Hvordan finder jeg novellens tema?",
                "Jeg har svært ved at forstå slutningen."
            ],
            "argumentation": [
                "Hvad er forskellen på påstand og belæg?",
                "Kan du læse mit argument og give feedback?",
                "Hvad betyder gendrivelse egentlig?"
            ],
            "essay": [
                "Hvordan starter jeg et godt essay?",
                "Er mine refleksioner dybe nok?",
                "Hjælp mig med at finde den røde tråd."
            ],
            "sprog": [
                "Hjælp mig med at finde metaforer i teksten.",
                "Hvad betyder intertekstualitet?",
                "Hvordan beskriver jeg forfatterens tone?"
            ]
        };

        const infoContents = {
            "eleven": {
                title: "Til dig som elev",
                content: "Hej! Denne chatbot er din personlige læremakker i dansk.\n\nDen giver dig ikke bare de færdige svar, som du kan skrive af. I stedet stiller den dig gode, vejledende spørgsmål, der hjælper dig med selv at finde frem til de rigtige løsninger.\n\nDet gør dig klogere og meget bedre forberedt til prøverne, uanset om du arbejder med at analysere en novelle, skrive et essay eller argumentere for en holdning."
            },
            "foraeldrene": {
                title: "Til forældrene",
                content: "Kære forældre.\n\nDenne digitale tutor er designet til at støtte jeres barns læring og nysgerrighed i faget dansk. \n\nI stedet for at fungere som en \"svarmaksine\", der afleverer det færdige arbejde til eleven, bruger denne chatbot en anerkendt sokratisk pædagogik: Den stiller modspørgsmål, anerkender gode pointer, og ansporer barnet til selvstændig tænkning og dybere forståelse af stoffet.\n\nVærktøjet er bygget ovenpå danske AI-modeller, der er lukket forsvarligt af, og deler ikke jeres barns private data."
            },
            "laereren": {
                title: "Til læreren",
                content: "Kære kollega.\n\nDette værktøj fungerer som en faglig og pædagogisk assistent for dine elever.\n\nDen pædagogiske baggrund bygger på den Sokratiske metode. Gennem avancerede \"system-prompts\" instrueres modellen i aldrig at udlevere konklusioner, men derimod spejle elevens svar, bede om tekstbelæg og stille uddybende spørgsmål inden for zonen for nærmeste udvikling.\n\nDu kan nemt tilpasse og differentiere bottens pædagogik via regnearket (Google Sheets). Løsningen motoriseres af SkoleGPT's API, hvilket sikrer en fuldstændig GDPR- og pædagogisk forsvarlig sprogmodel uden datatræning på elevernes indtastninger."
            }
        };

        let promptDatabase = {};
        const fallbackPrompt = "Du er SkoleGPT, en sokratisk dansklærer. Du taler kun dansk. Giv aldrig direkte svar, men stil hjælpende spørgsmål, der får eleven til at tænke selv.";

        let conversationHistory = [];

        // ==========================================
        // 2. DOM ELEMENTER
        // ==========================================
        const elements = {
            gradeSelect: document.getElementById('gradeSelect'),
            subjectSelect: document.getElementById('subjectSelect'),
            resetBtn: document.getElementById('resetBtn'),
            exportBtn: document.getElementById('exportBtn'),
            dyslexiaBtn: document.getElementById('dyslexiaBtn'),
            hintBtn: document.getElementById('hintBtn'),
            chatContainer: document.getElementById('chatContainer'),
            userInput: document.getElementById('userInput'),
            sendBtn: document.getElementById('sendBtn'),
            loadingIndicator: document.getElementById('loadingIndicator'),
            showPromptBtn: document.getElementById('showPromptBtn'),
            promptModal: document.getElementById('promptModal'),
            closeModalBtn: document.getElementById('closeModalBtn'),
            modalPromptText: document.getElementById('modalPromptText'),
            themeToggleBtn: document.getElementById('themeToggleBtn'),
            infoModal: document.getElementById('infoModal'),
            infoModalTitle: document.getElementById('infoModalTitle'),
            infoModalContent: document.getElementById('infoModalContent')
        };

        // ==========================================
        // GOOGLE SHEETS INTEGRATION (CSV Parser)
        // ==========================================
        
        function parseCSV(str) {
            const arr = [];
            let quote = false;
            let row = 0, col = 0;
            for (let c = 0; c < str.length; c++) {
                let cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] = (arr[row][col] || '') + cc;
            }
            return arr;
        }

        async function fetchSystemPrompts() {
            const btnText = document.getElementById('promptBtnText');
            
            if (SHEET_CSV_URL && SHEET_CSV_URL.trim() !== "") {
                try {
                    if(btnText) btnText.textContent = "Henter ark...";
                    
                    // Cache-buster (&cb=...) tvinger browseren til at hente den absolut nyeste version af arket!
                    const response = await fetch(SHEET_CSV_URL + "&cb=" + new Date().getTime(), { cache: "no-store" });
                    if (!response.ok) throw new Error("Kunne ikke hente regneark");
                    
                    const csvText = await response.text();
                    const data = parseCSV(csvText);
                    const newDatabase = {};
                    
                    // Starter fra 0, i tilfælde af at du ikke har overskrifter i række 1
                    for (let i = 0; i < data.length; i++) {
                        const row = data[i];
                        if (row && row.length >= 3) {
                            const rawGrade = (row[0] || "").trim();
                            // Ignorer eventuelle overskrifts-rækker, der indholder tekst i stedet for tal
                            if (rawGrade.toLowerCase().includes("klasse") && !rawGrade.match(/\d/)) continue;
                            
                            const gradeMatch = rawGrade.match(/\d+/);
                            const grade = gradeMatch ? gradeMatch[0] : null;

                            const rawSubject = (row[1] || "").trim().toLowerCase(); 
                            let subject = null;
                            if (rawSubject.includes("novelle")) subject = "novelleanalyse";
                            else if (rawSubject.includes("argumentation")) subject = "argumentation";
                            else if (rawSubject.includes("essay")) subject = "essay";
                            else if (rawSubject.includes("sprog") || rawSubject.includes("stil")) subject = "sprog";

                            const prompt = (row[2] || "").trim();
                            
                            if (grade && subject && prompt.length > 5) {
                                if (!newDatabase[grade]) newDatabase[grade] = {};
                                newDatabase[grade][subject] = prompt;
                            }
                        }
                    }
                    
                    if (Object.keys(newDatabase).length > 0) {
                        // Fletter de nye prompts ind
                        promptDatabase = Object.assign(promptDatabase, newDatabase); 
                        if(btnText) btnText.textContent = "Systemprompt ✓";
                        elements.showPromptBtn.classList.add('text-emerald-600', 'dark:text-emerald-400');
                    } else {
                        throw new Error("Ingen gyldige prompts fundet i CSV");
                    }
                } catch (error) {
                    console.error("Fejl ved indlæsning fra Google Sheet:", error);
                    if(btnText) btnText.textContent = "Systemprompt (Fejl)";
                }
            }
        }

        async function initApp() {
            // Hent indstillinger fra LocalStorage
            if(localStorage.getItem('dyslexiaMode') === 'true') {
                document.body.classList.add('dyslexic-mode');
            }

            // Hent nyeste prompts først
            await fetchSystemPrompts();
            
            // Check om der er en gemt samtale
            const savedHistory = localStorage.getItem('chatHistory');
            const savedGrade = localStorage.getItem('chatGrade');
            const savedSubject = localStorage.getItem('chatSubject');
            
            if (savedHistory && savedGrade && savedSubject) {
                try {
                    // Indlæs historik og opdater UI
                    conversationHistory = JSON.parse(savedHistory);
                    elements.gradeSelect.value = savedGrade;
                    elements.subjectSelect.value = savedSubject;
                    
                    // Opdater den gamle gemte systemprompt med den nyeste
                    if (conversationHistory.length > 0 && conversationHistory[0].role === "system") {
                        conversationHistory[0].content = getActiveSystemPrompt();
                    }
                    
                    renderHistoryToUI();
                    updateHintButtonVisibility();
                    
                    // Åbn chatten
                    elements.userInput.disabled = false;
                    elements.sendBtn.disabled = false;
                    elements.userInput.placeholder = "Skriv din besked her...";
                    elements.userInput.classList.remove('opacity-50', 'bg-slate-100', 'dark:bg-petrol-900');
                    elements.sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                } catch (e) {
                    resetConversation();
                }
            } else {
                resetConversation();
            }
        }

        // ==========================================
        // 3. LOGIK & FUNKTIONER
        // ==========================================

        function getActiveSystemPrompt() {
            const grade = elements.gradeSelect.value;
            const subject = elements.subjectSelect.value;
            if (promptDatabase[grade] && promptDatabase[grade][subject]) {
                return promptDatabase[grade][subject];
            }
            return fallbackPrompt;
        }

        function saveState() {
            localStorage.setItem('chatHistory', JSON.stringify(conversationHistory));
            localStorage.setItem('chatGrade', elements.gradeSelect.value);
            localStorage.setItem('chatSubject', elements.subjectSelect.value);
            updateHintButtonVisibility();
        }

        // Eksporterer chat til en tekstdokument
        function exportNotes() {
            if (conversationHistory.length <= 1) return alert("Der er ingen samtale at eksportere endnu.");
            
            const subject = elements.subjectSelect.options[elements.subjectSelect.selectedIndex].text;
            let textData = `Sokratisk Dansk-Tutor - Mine Noter\nEmne: ${subject}\nDato: ${new Date().toLocaleDateString('da-DK')}\n----------------------------------------\n\n`;
            
            conversationHistory.forEach(msg => {
                if(msg.role === 'user') {
                    textData += `DIG:\n${msg.content}\n\n`;
                } else if(msg.role === 'assistant') {
                    // Fjern markdown bolding (**) for ren tekst
                    let cleanText = msg.content.replace(/\*\*(.*?)\*\*/g, '$1');
                    textData += `TUTOR:\n${cleanText}\n\n----------------------------------------\n\n`;
                }
            });

            const blob = new Blob([textData], { type: "text/plain;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `Dansk_Noter_${subject.replace(/ /g, '_')}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Viser/skjuler Hint-knappen afhængig af om samtalen er i gang
        function updateHintButtonVisibility() {
            if (conversationHistory.length > 1) {
                elements.hintBtn.classList.remove('hidden', 'opacity-0', '-translate-y-full');
                elements.hintBtn.classList.add('opacity-100', 'translate-y-0');
            } else {
                elements.hintBtn.classList.add('hidden', 'opacity-0', '-translate-y-full');
                elements.hintBtn.classList.remove('opacity-100', 'translate-y-0');
            }
        }

        function renderHistoryToUI() {
            elements.chatContainer.innerHTML = '';
            
            // Tilføj velkomstbesked
            const subjectText = elements.subjectSelect.options[elements.subjectSelect.selectedIndex].text;
            const gradeText = elements.gradeSelect.options[elements.gradeSelect.selectedIndex].text;
            
            const welcomeBubble = createMessageBubble("assistant");
            welcomeBubble.update(`Hej igen! Jeg har gemt vores samtale. Vi arbejdede med **${subjectText}** på **${gradeText}** niveau.\n\nDu kan fortsætte, hvor vi slap, eller trykke på "Nulstil" øverst, hvis du vil starte på et nyt emne.`);

            // Tegn resten af historikken
            for (let i = 1; i < conversationHistory.length; i++) {
                appendMessageToUI(conversationHistory[i].role, conversationHistory[i].content);
            }
        }

        function createMessageBubble(role) {
            const isUser = role === 'user';
            
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex gap-4 ${isUser ? 'flex-row-reverse' : ''} animate-fade-in`;
            
            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0 border ${
                isUser ? 'bg-slate-700 dark:bg-petrol-700 text-white border-slate-800 dark:border-petrol-800' : 'bg-blue-100 dark:bg-petrol-800 border-blue-200 dark:border-petrol-700 dark:text-petrol-50'
            }`;
            avatar.innerHTML = isUser ? '👤' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = `p-4 rounded-2xl shadow-sm text-sm sm:text-base leading-relaxed max-w-[85%] whitespace-pre-wrap ${
                isUser 
                ? 'bg-blue-600 dark:bg-petrol-600 text-white rounded-tr-none border-blue-700 dark:border-petrol-700' 
                : 'bg-white dark:bg-petrol-900 text-slate-700 dark:text-petrol-50 rounded-tl-none border border-slate-200 dark:border-petrol-800'
            }`;
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(bubble);
            elements.chatContainer.appendChild(messageDiv);
            
            return {
                update: (text) => {
                    let formattedContent = text;
                    if (!isUser) {
                        formattedContent = formattedContent.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
                    }
                    bubble.innerHTML = formattedContent;
                    elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
                }
            };
        }

        function appendMessageToUI(role, content) {
            const bubble = createMessageBubble(role);
            bubble.update(content);
        }

        function renderStarters() {
            const subject = elements.subjectSelect.value;
            const starters = conversationStarters[subject];
            
            if (!starters) return;

            const starterContainer = document.createElement('div');
            starterContainer.id = "starterContainer";
            starterContainer.className = "flex flex-wrap gap-2 mt-2 ml-12 animate-fade-in";
            
            starters.forEach(text => {
                const btn = document.createElement('button');
                btn.className = "bg-blue-50 dark:bg-petrol-800 border border-blue-200 dark:border-petrol-700 hover:bg-blue-100 dark:hover:bg-petrol-700 text-blue-700 dark:text-petrol-100 text-sm py-1.5 px-3 rounded-full transition-colors shadow-sm text-left";
                btn.textContent = text;
                btn.onclick = () => {
                    elements.userInput.value = text;
                    handleSend();
                    starterContainer.remove(); // Fjern knapperne når de er brugt
                };
                starterContainer.appendChild(btn);
            });

            elements.chatContainer.appendChild(starterContainer);
        }

        function resetConversation() {
            const grade = elements.gradeSelect.value;
            const subject = elements.subjectSelect.value;
            
            elements.chatContainer.innerHTML = '';
            
            // Fjern eventuelle gamle startere
            const starterDiv = document.getElementById('starterContainer');
            if (starterDiv) starterDiv.remove();

            // Hvis eleven ikke har valgt klasse og emne endnu
            if (!grade || !subject) {
                const welcomeBubble = createMessageBubble("assistant");
                welcomeBubble.update("Hej! Jeg er din læremakker i dansk.\n\nStart med at **vælge klassetrin og emne** i toppen af skærmen, så vi kan komme i gang!");
                
                elements.userInput.disabled = true;
                elements.sendBtn.disabled = true;
                elements.userInput.placeholder = "Vælg klassetrin og emne først...";
                elements.userInput.classList.add('opacity-50', 'bg-slate-100', 'dark:bg-petrol-900');
                elements.sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
                
                conversationHistory = [];
                updateHintButtonVisibility();
                return;
            }

            // Hvis klasse og emne ER valgt, åbn chatten
            elements.userInput.disabled = false;
            elements.sendBtn.disabled = false;
            elements.userInput.placeholder = "Skriv din besked her...";
            elements.userInput.classList.remove('opacity-50', 'bg-slate-100', 'dark:bg-petrol-900');
            elements.sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            const sysPrompt = getActiveSystemPrompt();
            
            conversationHistory = [
                { role: "system", content: sysPrompt }
            ];

            // Slet gemt historik
            localStorage.removeItem('chatHistory');
            updateHintButtonVisibility();
            
            const subjectText = elements.subjectSelect.options[elements.subjectSelect.selectedIndex].text;
            const gradeText = elements.gradeSelect.options[elements.gradeSelect.selectedIndex].text;
            
            const welcomeBubble = createMessageBubble("assistant");
            welcomeBubble.update(`Hej! Jeg er din læremakker i dansk. Vi arbejder nu med **${subjectText}** på **${gradeText}** niveau.\n\nHvad vil du gerne kigge på, eller hvad har du svært ved? Husk: Jeg giver dig ikke svarene direkte, men hjælper dig med selv at finde frem til dem!`);

            // Vis forslag til samtale-startere
            renderStarters();
        }

        function toggleLoading(show) {
            if (show) {
                elements.loadingIndicator.classList.remove('hidden');
                elements.chatContainer.scrollTop = elements.chatContainer.scrollHeight;
            } else {
                elements.loadingIndicator.classList.add('hidden');
            }
            elements.sendBtn.disabled = show;
            elements.userInput.disabled = show;
            
            if(show) {
                elements.sendBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                elements.sendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                elements.userInput.focus();
            }
        }

        async function handleSend(forcedText = null) {
            const text = forcedText || elements.userInput.value.trim();
            if (!text) return;

            // Fjern eventuelle ubrugte startere
            const starterDiv = document.getElementById('starterContainer');
            if (starterDiv) starterDiv.remove();

            appendMessageToUI("user", text);
            elements.userInput.value = '';
            elements.userInput.style.height = 'auto';

            conversationHistory.push({ role: "user", content: text });
            saveState(); // Gem at brugeren har skrevet

            toggleLoading(true);

            const payload = {
                model: MODEL_NAME,
                messages: conversationHistory,
                stream: true
            };

            const botBubble = createMessageBubble("assistant");
            let fullResponse = "";

            try {
                const response = await fetch(API_ENDPOINT, {
                    method: "POST",
                    headers: {
                        // Authorization headeren er fjernet her, da Cloudflare proxyen nu indsætter nøglen sikkert!
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(`Serverfejl: ${response.status}`);

                toggleLoading(false);

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let buffer = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); 
                    
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed) continue;
                        if (trimmed === 'data: [DONE]') continue;
                        
                        if (trimmed.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(trimmed.substring(6));
                                if (data.choices && data.choices[0].delta && data.choices[0].delta.content) {
                                    fullResponse += data.choices[0].delta.content;
                                    botBubble.update(fullResponse);
                                }
                            } catch (e) {}
                        }
                    }
                }

                conversationHistory.push({ role: "assistant", content: fullResponse });
                saveState(); // Gem bottens svar

            } catch (error) {
                console.error("Fetch fejl:", error);
                toggleLoading(false);
                botBubble.update(`Beklager, jeg stødte på en fejl: ${error.message}`);
            }
        }

        // ==========================================
        // 4. EVENT LISTENERS & MODALS
        // ==========================================

        elements.sendBtn.addEventListener('click', () => handleSend());
        elements.resetBtn.addEventListener('click', resetConversation);
        elements.exportBtn.addEventListener('click', exportNotes);

        // Skift i dropdowns rydder chatten automatisk og sætter nyt emne
        elements.gradeSelect.addEventListener('change', resetConversation);
        elements.subjectSelect.addEventListener('change', resetConversation);

        // Ordblinde-venligt design toggle
        elements.dyslexiaBtn.addEventListener('click', () => {
            const isDyslexic = document.body.classList.toggle('dyslexic-mode');
            localStorage.setItem('dyslexiaMode', isDyslexic);
            
            // Giv lille visuel feedback på knappen
            elements.dyslexiaBtn.classList.add('bg-blue-200', 'dark:bg-teal-700');
            setTimeout(() => {
                elements.dyslexiaBtn.classList.remove('bg-blue-200', 'dark:bg-teal-700');
            }, 300);
        });

        // "Giv mig et hint"-knap genvej
        elements.hintBtn.addEventListener('click', () => {
            const hintText = "Jeg er kørt lidt fast og ved ikke helt, hvad jeg skal svare. Kan du give mig et lille hint eller spørge mig på en anden måde, uden at give mig svaret?";
            handleSend(hintText);
        });

        // Systemprompt Modal
        elements.showPromptBtn.addEventListener('click', () => {
            elements.modalPromptText.textContent = getActiveSystemPrompt();
            elements.promptModal.classList.remove('hidden');
        });
        elements.closeModalBtn.addEventListener('click', () => elements.promptModal.classList.add('hidden'));
        elements.promptModal.addEventListener('click', (e) => {
            if (e.target === elements.promptModal) elements.promptModal.classList.add('hidden');
        });

        // Info Modals
        function openInfoModal(target) {
            const data = infoContents[target];
            if (data) {
                elements.infoModalTitle.textContent = data.title;
                elements.infoModalContent.textContent = data.content;
                elements.infoModal.classList.remove('hidden');
            }
        }
        function closeInfoModal() { elements.infoModal.classList.add('hidden'); }
        elements.infoModal.addEventListener('click', (e) => {
            if (e.target === elements.infoModal) closeInfoModal();
        });

        // Tema Toggle
        elements.themeToggleBtn.addEventListener('click', () => {
            document.documentElement.classList.toggle('dark');
        });

        // Enter for at sende
        elements.userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault(); 
                handleSend();
            }
        });

        // Auto-resize tekstboks
        elements.userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value === '') this.style.height = '44px';
        });

        // Kør initialisering ved load
        initApp();

    </script>
</body>
</html>
